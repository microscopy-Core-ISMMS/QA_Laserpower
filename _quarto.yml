project:
  type: website
  output-dir: _site
  execute-dir: project

  render:
    - index.ipynb
    - microscopes/*.qmd

  resources:
    - "outputs/**"

metadata-files:
  - _navbar.yml

website:
  title: "Quality Assesment"

  page-footer:
    center: "Generated automatically with Quarto and GitHub Actions"

format:
  html:
    theme: flatly
    css: styles.css
    toc: true

    grid:
      body-width: 750px
      margin-width: 400px
execute:
  echo: false
  warning: false
  error: false
