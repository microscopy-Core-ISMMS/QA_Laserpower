name: Publish Quarto website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check Quarto installation
        run: |
          quarto --version
          quarto check jupyter

      # -------------------------------------------------
      # 1. Run the analysis first
      # -------------------------------------------------
      - name: Generate microscope analysis
        run: |
          quarto render index.ipynb --execute

      # -------------------------------------------------
      # 2. Generate one Quarto page per microscope
      # -------------------------------------------------
      - name: Generate microscope pages
        run: |
          python scripts/generate_microscope_pages.py

      # -------------------------------------------------
      # 3. Render the complete website
      # -------------------------------------------------
      - name: Render Quarto website
        run: |
          quarto render

      # -------------------------------------------------
      # 4. Publish to GitHub Pages
      # -------------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4