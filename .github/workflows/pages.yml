name: Publish Quarto website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Check Quarto installation
        run: |
          quarto --version
          quarto check jupyter

      # --------------------------------------------
      # 1. Run index.ipynb
      # --------------------------------------------
      - name: Generate microscope analysis
        run: quarto render index.ipynb --execute

      # --------------------------------------------
      # 2. Verify plots and Excel files
      # --------------------------------------------
      - name: Check generated outputs
        run: |
          echo "Generated output files:"
          find outputs -maxdepth 3 -type f | sort

      # --------------------------------------------
      # 3. Create one page per microscope
      # --------------------------------------------
      - name: Generate microscope pages
        run: python scripts/generate_microscope_pages.py

      # --------------------------------------------
      # 4. Verify generated qmd pages
      # --------------------------------------------
      - name: Check generated microscope pages
        run: |
          echo "Generated microscope pages:"
          find microscopes -maxdepth 1 -type f | sort

      # --------------------------------------------
      # 5. Render microscope pages one at a time
      # --------------------------------------------
      - name: Render microscope pages
        run: |
          for page in microscopes/*.qmd; do
            echo "Rendering $page"
            quarto render "$page"
          done

      # --------------------------------------------
      # 6. Check final website
      # --------------------------------------------
      - name: Check rendered website
        run: |
          echo "Rendered website files:"
          find _site -maxdepth 3 -type f | sort

      # --------------------------------------------
      # 7. Configure GitHub Pages
      # --------------------------------------------
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # --------------------------------------------
      # 8. Upload rendered website
      # --------------------------------------------
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4